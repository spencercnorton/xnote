name: Feature request
description: Propose a change to how XNote works.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that XNote makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and where would it live — the note itself, the toolbar, the right-click menu, Preferences, the tray menu, the command line, or the backup helper?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Notes and editing
        - Toolbar and colours
        - Preferences
        - Tray icon
        - Startup, autostart or quitting
        - Backup helper (xnote-cloud-backup)
        - Command line
        - Build or packaging
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including anything XNote already does that gets close.
