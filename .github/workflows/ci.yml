# Build and test XNote on every pull request and on main: the autotools build
# with -Werror, the GLib test suite, the Wayland smoke test on a headless
# weston, and the Go tests for the backup helper. No secrets, read-only token,
# GitHub-owned actions pinned by commit.
name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Build and install-test packages against the supported Ubuntu 26.04 target.
    container: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Container prerequisites
        run: apt-get update -q && apt-get install -q -y git ca-certificates sudo curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace for Go VCS metadata
        # debhelper replaces HOME, so use this disposable container's system config.
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      # The README list, plus weston + dbus for the smoke test and rsync for the
      # backup helper's remote tests.
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool intltool \
            gettext autopoint pkg-config autoconf-archive libgtk-4-dev libadwaita-1-dev \
            libgtksourceview-5-dev libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            weston dbus rsync debhelper dh-autoreconf
      # The same checksummed Go 1.26.8 the release builds use (go.mod refuses
      # older compilers). The script exports PATH only for the shell that sources
      # it; it runs under sudo here for /opt, so the PATH change is re-applied.
      - name: Go toolchain
        run: |
          sudo sh ci/install-go-toolchain.sh
          echo /opt/xnote-go-1.26.8/bin >> "$GITHUB_PATH"
      - name: Build (--enable-debug=most is -Wall -Werror)
        run: |
          NOCONFIGURE=1 ./autogen.sh
          ./configure --prefix=/usr --enable-debug=most
          make -j"$(nproc)"
      # XNote is native Wayland. Only our own DT_NEEDED entries are policed:
      # ldd would show libX11 through libgtk-4, which ships both backends.
      - name: No direct X11 linkage
        run: |
          if readelf -d src/xnote | grep NEEDED | grep -qE 'libX11|libXi|libSM|libICE'; then
            readelf -d src/xnote | grep NEEDED
            echo 'ERROR - src/xnote directly links X libraries; XNote is native Wayland.'
            exit 1
          fi
      - name: GLib test suite
        run: make check || { cat tests/test-suite.log; exit 1; }
      # A real wl_compositor (headless weston) and a session bus, no synthetic
      # input, no tray: tests/wayland-smoke.sh explains both. Installed first so
      # the on-disk layout is the shipping one. GTK_A11Y=none: the script fails
      # on any Gtk-WARNING, and GTK 4.14 logs one when no accessibility bus
      # exists on the private session bus.
      - name: Wayland smoke test
        env:
          GTK_A11Y: none
        run: |
          sudo make install
          dbus-run-session -- tests/wayland-smoke.sh /usr/bin/xnote
      - name: Go tests (backup helper)
        run: cd cloud-helper && go test -mod=vendor -count=1 -timeout=300s ./...
      # -d only bypasses the distribution's older golang-go dependency;
      # the exact required Go toolchain was installed and tested above.
      - name: Build Debian candidate from the public tree
        run: |
          VERSION=$(sed -n 's/^AC_INIT(\[XNote\],\[\([^]]*\)\],.*/\1/p' configure.ac)
          test -n "$VERSION"
          cat > debian/changelog <<EOF
          xnote ($VERSION) unstable; urgency=medium

            * Build the public GitHub source.

           -- NorviTech <131503564+spencercnorton@users.noreply.github.com>  $(date -u -R)
          EOF
          dpkg-buildpackage -us -uc -b -d
          mkdir -p dist
          cp ../xnote_*.deb dist/
          cd dist && sha256sum *.deb > SHA256SUMS.txt
      # lintian's errors and warnings (debian/xnote.lintian-overrides holds the
      # accepted ones), then what lintian cannot know: scripts/check-deb.sh.
      - name: Check Debian candidate
        run: |
          sudo apt-get install -q -y --no-install-recommends lintian
          lintian --fail-on error,warning dist/*.deb
          scripts/check-deb.sh dist/*.deb
      - name: Verify packaged install on Ubuntu 26.04
        env:
          GTK_A11Y: none
        run: |
          sudo apt-get install -q -y --no-install-recommends ./dist/*.deb
          xnote --version
          dbus-run-session -- tests/wayland-smoke.sh /usr/bin/xnote
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xnote-debian-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
